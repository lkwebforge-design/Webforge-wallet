  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ivacdswettainjderwwz.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_BSGXyRFXfusvraBcA-nU0g_xxQqcyYe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
